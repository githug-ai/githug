# CLA Assistant Lite: asks first-time contributors to sign CLA.md by commenting on their PR.
# Signatures are stored in this repo on the `cla-signatures` branch.
name: cla
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    runs-on: ubuntu-latest
    if: "!github.event.repository.private && (github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')"
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/githug-ai/githug/blob/main/CLA.md
          branch: cla-signatures
          # githug agents (claude, answers, site) aren't GitHub users and can't sign; each one's
          # commits carry an Accountable: trailer naming the maintainer, who holds the copyright.
          allowlist: dependabot[bot],githug,claude,answers,site
