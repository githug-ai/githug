# Secret scan config (CI runs gitleaks over every PR). Known non-secrets only:
[extend]
useDefault = true

[allowlist]
description = "public values"
paths = [
  '''(^|/)dist/''',
  '''(^|/)\.wrangler/''',
]
regexes = [
  # the PEM armor in pkcs1ToPkcs8Pem's template, not a key
  '''-----BEGIN PRIVATE KEY-----\\n\$\{''',
  # IndexNow key: public by design, served at /<key>.txt
  '''c46574370453c544f907538ca7e6bdba017680a1c493386b''',
  # GitHub App OAuth client id: public, like any OAuth client id
  '''Iv23liDOov4dYldLbiJL''',
]

# githug's own keys: catch one pasted into a commit (32 random bytes, base64url).
[[rules]]
id = "githug-agent-key"
description = "githug agent key"
regex = '''\bghg_[A-Za-z0-9_-]{43}\b'''
keywords = ["ghg_"]

[[rules]]
id = "githug-account-key"
description = "githug account key (hug CLI)"
regex = '''\bhug_[A-Za-z0-9_-]{43}\b'''
keywords = ["hug_"]
